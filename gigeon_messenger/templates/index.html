<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gigeon Messenger</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Auth Screen -->
    <div id="auth-screen" class="auth-screen">
        <div class="auth-container">
            <h1 class="logo">Gigeon</h1>
            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login">Вход</button>
                <button class="tab-btn" data-tab="register">Регистрация</button>
            </div>
            
            <form id="login-form" class="auth-form">
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Пароль" required>
                <button type="submit" class="btn-primary">Войти</button>
            </form>
            
            <form id="register-form" class="auth-form hidden">
                <input type="text" id="register-username" placeholder="Имя пользователя" required>
                <input type="email" id="register-email" placeholder="Email" required>
                <input type="password" id="register-password" placeholder="Пароль" required>
                <button type="submit" class="btn-primary">Зарегистрироваться</button>
            </form>
        </div>
    </div>

    <!-- Main App -->
    <div id="app-screen" class="app-screen hidden">
        <!-- Server List -->
        <div class="server-list">
            <div class="server-icon home" title="Главная">
                <span>O</span>
            </div>
            <div class="server-separator"></div>
            <div id="servers-container"></div>
            <div class="server-icon add-server" title="Добавить сервер">
                <span>+</span>
            </div>
        </div>

        <!-- Channels Sidebar -->
        <div class="channels-sidebar">
            <div class="server-header">
                <h2 id="server-name">Gigeon Community</h2>
            </div>
            <div class="channels-list" id="channels-container">
                <!-- Channels will be loaded here -->
            </div>
            <div class="user-panel">
                <div class="user-info" id="current-user-info">
                    <div class="avatar" id="current-user-avatar"></div>
                    <div class="user-details">
                        <div class="username" id="current-username"></div>
                        <div class="user-tag" id="current-user-tag"></div>
                    </div>
                </div>
                <button class="settings-btn" id="open-settings" title="Настройки">O</button>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <div class="chat-header">
                <span class="channel-icon">#</span>
                <h3 id="channel-name">general</h3>
                <div class="call-buttons">
                    <button class="call-btn" id="start-voice-call" title="Голосовой звонок">[V]</button>
                    <button class="call-btn" id="start-video-call" title="Видеозвонок">[C]</button>
                </div>
            </div>
            
            <div class="messages-container" id="messages-container">
                <!-- Messages will be loaded here -->
            </div>
            
            <div class="message-input-container">
                <div class="typing-indicator" id="typing-indicator"></div>
                <div class="message-input-wrapper">
                    <button class="attach-btn" id="voice-record-btn" title="Голосовое сообщение">[M]</button>
                    <input type="text" id="message-input" placeholder="Отправить сообщение в #general">
                    <button class="send-btn" id="send-message-btn">></button>
                </div>
            </div>
        </div>

        <!-- Members Sidebar -->
        <div class="members-sidebar">
            <h3>Участники</h3>
            <div id="members-container">
                <!-- Members will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content settings-modal">
            <div class="modal-header">
                <h2>Настройки</h2>
                <button class="close-btn" id="close-settings">X</button>
            </div>
            <div class="settings-content">
                <div class="settings-nav">
                    <button class="nav-btn active" data-section="account">Аккаунт</button>
                    <button class="nav-btn" data-section="privacy">Конфиденциальность</button>
                    <button class="nav-btn" data-section="appearance">Внешний вид</button>
                </div>
                <div class="settings-sections">
                    <div class="section active" id="account-section">
                        <h3>Аккаунт</h3>
                        <div class="form-group">
                            <label>Имя пользователя</label>
                            <input type="text" id="settings-username">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="settings-email">
                        </div>
                        <div class="form-group">
                            <label>Статус</label>
                            <select id="settings-status">
                                <option value="online">В сети</option>
                                <option value="idle">Отошел</option>
                                <option value="dnd">Не беспокоить</option>
                                <option value="offline">Не в сети</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Аватар (URL)</label>
                            <input type="text" id="settings-avatar" placeholder="https://...">
                        </div>
                        <button class="btn-primary" id="save-settings">Сохранить</button>
                    </div>
                    <div class="section" id="privacy-section">
                        <h3>Конфиденциальность</h3>
                        <p>Настройки приватности будут доступны в будущем.</p>
                    </div>
                    <div class="section" id="appearance-section">
                        <h3>Внешний вид</h3>
                        <p>Минималистичный дизайн уже включен.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Call Modal -->
    <div id="call-modal" class="modal hidden">
        <div class="modal-content call-modal">
            <div class="call-header">
                <h2 id="call-title">Голосовой звонок</h2>
                <button class="close-btn" id="end-call">X</button>
            </div>
            <div class="call-content">
                <div class="participants-grid" id="call-participants">
                    <!-- Participants will be shown here -->
                </div>
                <div class="call-controls">
                    <button class="control-btn" id="toggle-mic" title="Микрофон">[M]</button>
                    <button class="control-btn" id="toggle-camera" title="Камера">[C]</button>
                    <button class="control-btn end-call-btn" id="leave-call" title="Завершить">[X]</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
